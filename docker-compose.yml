version: '3.8'

# Single service: the image runs both the Next.js frontend (:3000) and the
# Hono API (:3001). No database container — ForgeAI is BYOK and talks to the
# user's own Supabase project over HTTPS when dbRequired is set.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file:
      - .env
    restart: unless-stopped
